<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ella's calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Ella's Calculator</h1>

    <div class="calculator">

        <input id="display" type="text" placeholder="0">

        <button id="seven" value="7">7</button>
        <button id="eight" value="8">8</button>
        <button id="nine" value="9">9</button>
        <button id="division" value="/">/</button>

        <button id="four" value="4">4</button>
        <button id="five" value="5">5</button>
        <button id="six" value="6">6</button>
        <button id="multiplication" value="*">*</button>

        <button id="one" value="1">1</button>
        <button id="two" value="2">2</button>
        <button id="three" value="3">3</button>
        <button id="subtraction" value="-">-</button>

        <button id="zero" value="0">0</button>
        <button id="decimal" value=".">.</button>
        <button id="power" value="^">^</button>
        <button id="addition" value="+">+</button>

        <button id="clear" value="C">C</button>
        <button id="equality" value="=">=</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
